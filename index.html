<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jurnal Backtest Trading</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 12px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .card {
            background-color: #1e1e1e;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        h2 { 
            margin: 5px 0 15px 0; 
            color: #bb86fc; 
            font-size: 1.3rem; 
            text-align: center;
        }
        h3 { 
            margin-top: 0; 
            margin-bottom: 12px; 
            color: #bb86fc; 
            font-size: 1rem; 
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 8px;
        }
        
        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }
        .form-row {
            display: flex;
            gap: 10px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
        }
        label { font-size: 0.8rem; color: #a0a0a0; }
        
        input, select {
            padding: 12px;
            background-color: #2a2a2a;
            border: 1px solid #3c3c3c;
            color: #fff;
            border-radius: 8px;
            font-size: 1rem;
            width: 100%;
        }
        input:focus, select:focus { outline: none; border-color: #bb86fc; }
        
        button {
            background-color: #bb86fc;
            color: #000;
            font-weight: bold;
            border: none;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
        }
        button:active { background-color: #9965f4; transform: scale(0.98); }
        
        .btn-secondary {
            background-color: #333;
            color: #fff;
            padding: 12px;
            width: auto;
            white-space: nowrap;
        }

        .summary-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: #2a2a2a;
            padding: 12px;
            border-radius: 8px;
        }
        .summary-stats {
            display: flex;
            justify-content: space-around;
            border-top: 1px solid #3c3c3c;
            padding-top: 10px;
            margin-top: 5px;
        }
        .summary-item { text-align: center; }
        .summary-value { font-size: 1.1rem; font-weight: bold; margin-top: 4px; }

        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
            min-width: 500px;
        }
        th, td {
            padding: 10px 8px;
            text-align: left;
            border-bottom: 1px solid #2a2a2a;
            font-size: 0.82rem;
        }
        th { background-color: #2a2a2a; color: #bb86fc; }
        .win { color: #4caf50; font-weight: bold; }
        .loss { color: #f44336; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Backtest Trading Manual</h2>

    <!-- Ringkasan Portofolio -->
    <div class="card">
        <div class="summary-box">
            <div class="form-group">
                <label>Saldo Awal / Modal (Rp)</label>
                <div style="display: flex; gap: 8px;">
                    <input type="number" id="initialBalanceInput" value="1000000" inputmode="numeric" placeholder="Contoh: 1000000">
                    <button class="btn-secondary" onclick="updateInitialBalance()">Set Saldo</button>
                </div>
            </div>
            
            <div class="summary-stats">
                <div class="summary-item">
                    <label>Saldo Saat Ini</label>
                    <div id="displaySaldo" class="summary-value" style="color: #03dac6;">Rp 1.000.000</div>
                </div>
                <div class="summary-item">
                    <label>Total Trade</label>
                    <div id="displayTotal" class="summary-value">0</div>
                </div>
                <div class="summary-item">
                    <label>Win Rate</label>
                    <div id="displayWinRate" class="summary-value">0%</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Form Input Trade -->
    <div class="card">
        <h3>Input Data Backtest</h3>
        <div class="form-grid">
            <div class="form-row">
                <div class="form-group">
                    <label>Tanggal</label>
                    <input type="date" id="tradeDate">
                </div>
                <div class="form-group">
                    <label>Harga Entry</label>
                    <input type="number" id="entryPrice" step="any" inputmode="decimal" placeholder="0">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Harga TP</label>
                    <input type="number" id="tpPrice" step="any" inputmode="decimal" placeholder="0">
                </div>
                <div class="form-group">
                    <label>Harga SL</label>
                    <input type="number" id="slPrice" step="any" inputmode="decimal" placeholder="0">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Hasil Eksekusi</label>
                    <select id="tradeResult">
                        <option value="TP">Kena TP (Win)</option>
                        <option value="SL">Kena SL (Loss)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Nominal Profit/Loss (Rp)</label>
                    <input type="number" id="pnlAmountInput" inputmode="numeric" placeholder="Contoh: 200000">
                </div>
            </div>
        </div>
        <button onclick="addTrade()">Tambah ke Jurnal</button>
    </div>

    <!-- Tabel Riwayat Trade -->
    <div class="card">
        <h3>Riwayat Backtest</h3>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Tanggal</th>
                        <th>Entry</th>
                        <th>Status</th>
                        <th>Nominal PnL</th>
                        <th>Saldo Akhir</th>
                    </tr>
                </thead>
                <tbody id="tradeTableBody">
                    <!-- Data dari JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let currentBalance = 1000000;
    let totalTrades = 0;
    let totalWins = 0;

    document.getElementById('tradeDate').valueAsDate = new Date();

    function formatRupiah(angka) {
        return new Intl.NumberFormat('id-ID', {
            style: 'currency',
            currency: 'IDR',
            maximumFractionDigits: 0
        }).format(angka);
    }

    function updateInitialBalance() {
        const newBalance = parseFloat(document.getElementById('initialBalanceInput').value);
        if (isNaN(newBalance) || newBalance <= 0) {
            alert("Masukkan nilai saldo awal yang valid!");
            return;
        }

        currentBalance = newBalance;
        totalTrades = 0;
        totalWins = 0;

        document.getElementById('displaySaldo').innerText = formatRupiah(currentBalance);
        document.getElementById('displayTotal').innerText = '0';
        document.getElementById('displayWinRate').innerText = '0%';
        document.getElementById('tradeTableBody').innerHTML = '';

        alert("Saldo berhasil diperbarui!");
    }

    function addTrade() {
        const date = document.getElementById('tradeDate').value;
        const entry = parseFloat(document.getElementById('entryPrice').value);
        const tp = parseFloat(document.getElementById('tpPrice').value);
        const sl = parseFloat(document.getElementById('slPrice').value);
        const result = document.getElementById('tradeResult').value;
        let pnlAmount = parseFloat(document.getElementById('pnlAmountInput').value);

        if (!date || isNaN(entry) || isNaN(tp) || isNaN(sl) || isNaN(pnlAmount)) {
            alert("Harap isi Tanggal, Entry, TP, SL, dan Nominal Profit/Loss!");
            return;
        }

        // Jika kena SL, pastikan nilainya minus
        if (result === 'SL') {
            pnlAmount = -Math.abs(pnlAmount);
        } else {
            pnlAmount = Math.abs(pnlAmount);
            totalWins++;
        }

        // Tambahkan ke saldo utama
        currentBalance += pnlAmount;
        totalTrades++;

        // Update Ringkasan Dashboard
        document.getElementById('displaySaldo').innerText = formatRupiah(currentBalance);
        document.getElementById('displayTotal').innerText = totalTrades;
        document.getElementById('displayWinRate').innerText = ((totalWins / totalTrades) * 100).toFixed(1) + '%';

        // Tambahkan ke Tabel
        const tableBody = document.getElementById('tradeTableBody');
        const row = document.createElement('tr');

        const statusClass = result === 'TP' ? 'win' : 'loss';
        const pnlPrefix = pnlAmount >= 0 ? '+' : '';
        const pnlFormatted = `${pnlPrefix}${formatRupiah(pnlAmount)}`;

        row.innerHTML = `
            <td>${date}</td>
            <td>${entry.toLocaleString('id-ID')}</td>
            <td class="${statusClass}">Kena ${result}</td>
            <td class="${statusClass}">${pnlFormatted}</td>
            <td style="font-weight: bold;">${formatRupiah(currentBalance)}</td>
        `;

        tableBody.insertBefore(row, tableBody.firstChild);

        // Reset input harga & profit
        document.getElementById('entryPrice').value = '';
        document.getElementById('tpPrice').value = '';
        document.getElementById('slPrice').value = '';
        document.getElementById('pnlAmountInput').value = '';
    }
</script>

</body>
</html>
